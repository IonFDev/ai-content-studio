services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-studio-app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - app_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: youtube_studio
      DB_USERNAME: youtube_studio
      DB_PASSWORD: youtube_studio
      QUEUE_CONNECTION: sync
      CACHE_STORE: file
      SESSION_DRIVER: file
      FILESYSTEM_DISK: local
      WHISPER_SERVICE_URL: http://whisper:8000
      WHISPER_TIMEOUT: 3600
    depends_on:
      db:
        condition: service_healthy

  vite:
    image: node:24-bookworm
    container_name: youtube-studio-vite
    working_dir: /var/www/html
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: >-
      sh -c "
      until [ -f package.json ]; do echo 'Waiting for Laravel initialization...'; sleep 2; done;
      npm install;
      npm install bootstrap@5.3.8 @popperjs/core;
      npm run dev -- --host 0.0.0.0
      "
    depends_on:
      app:
        condition: service_started

  whisper:
    build:
      context: .
      dockerfile: whisper/Dockerfile
    container_name: youtube-studio-whisper
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - ./storage/app:/data/app
      - whisper_models:/models
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  db:
    image: mysql:8.4
    container_name: youtube-studio-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: youtube_studio
      MYSQL_USER: youtube_studio
      MYSQL_PASSWORD: youtube_studio
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  app_vendor:
  node_modules:
  whisper_models:
